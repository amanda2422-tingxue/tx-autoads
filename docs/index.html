<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoAds Platform - Legal Documents</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .container {
      max-width: 600px;
      width: 100%;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      color: #fff;
      font-size: 28px;
      font-weight: bold;
    }
    h1 {
      font-size: 24px;
      color: #1a1a2e;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 32px;
    }
    .doc-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .doc-link {
      display: flex;
      align-items: center;
      padding: 20px 24px;
      background: #f8f9fa;
      border-radius: 12px;
      text-decoration: none;
      color: #1a1a2e;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    .doc-link:hover {
      background: #fff;
      border-color: #667eea;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(102,126,234,0.15);
    }
    .doc-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      margin-right: 16px;
      flex-shrink: 0;
    }
    .doc-info {
      text-align: left;
      flex: 1;
    }
    .doc-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .doc-desc {
      font-size: 13px;
      color: #888;
    }
    .doc-arrow {
      color: #999;
      font-size: 18px;
      transition: color 0.2s;
    }
    .doc-link:hover .doc-arrow {
      color: #667eea;
    }
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #aaa;
    }
    .lang-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 8px;
    }
    .lang-btn {
      padding: 6px 14px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.15);
      color: #fff;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-btn:hover, .lang-btn.active {
      background: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">A</div>
      <h1>AutoAds Platform</h1>
      <p class="subtitle">Zeydoo Internal Advertising Management Tool</p>

      <div class="doc-list">
        <a href="privacy.html" class="doc-link">
          <div class="doc-icon">&#128274;</div>
          <div class="doc-info">
            <div class="doc-title">隐私政策</div>
            <div class="doc-desc">Privacy Policy - 了解我们如何收集、使用和保护您的数据</div>
          </div>
          <div class="doc-arrow">&#8250;</div>
        </a>
        <a href="terms.html" class="doc-link">
          <div class="doc-icon">&#128196;</div>
          <div class="doc-info">
            <div class="doc-title">服务条款</div>
            <div class="doc-desc">Terms of Service - 使用本平台的规则和条件</div>
          </div>
          <div class="doc-arrow">&#8250;</div>
        </a>
      </div>

      <div class="footer">
        &copy; 2026 Zeydoo. All rights reserved.
      </div>
    </div>
  </div>
</body>
</html>
